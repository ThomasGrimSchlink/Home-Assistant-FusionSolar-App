mock_scenario:
  name: Advance/reset developer mock scenario
  description: >-
    Offline development only. Registered only while an explicitly opted-in
    transition mock entry is loaded. Never targets real accounts or hardware.
    Applies the next/first frame before a real coordinator poll; declared faults
    persist until the next advance/reset. Requires administrator access.
  fields:
    config_entry_id:
      name: Mock config entry ID
      description: Exact config entry ID of the loaded transition mock (not an entity ID).
      required: true
      example: "01MOCKENTRYID"
      selector:
        text:
    operation:
      name: Operation
      required: true
      selector:
        select:
          options:
            - advance
            - reset

battery_charge:
  name: Charge battery to target SOC
  description: >-
    Start forced charging via the undocumented FusionSolar EU5 web API.
    Requires a real integration entry. No automatic retry is performed.
  fields:
    config_entry_id:
      name: Config entry ID
      required: true
      selector:
        text:
    target_soc:
      name: Target SOC (%)
      required: true
      example: 80
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: box
